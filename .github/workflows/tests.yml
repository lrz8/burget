name: Offline checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
      - name: Compile Python sources
        run: uv run --frozen python -m compileall -q main.py src tests
      - name: Run offline regression tests
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Run report smoke test
        run: uv run --frozen python tests/offline_smoke.py
